
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-reliability-proxy"
version = "0.1.0"
dependencies = [
    "python-dotenv",
    "httpx",
    "pydantic"
]

[project.optional-dependencies]
providers = [
    "groq",
    "anthropic",
    "openai",
    "google-genai",
    "mistralai",
    "cohere",
    "together",
    "fireworks-ai",
    "cerebras-cloud-sdk",
    "huggingface-hub",
    "ollama",
    "boto3",
    "azure-ai-inference",
    "google-cloud-aiplatform",
    "replicate"
]

[tool.setuptools.packages.find]
include = ["llm_proxy*"]
