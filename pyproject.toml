[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-reliability-proxy"
version = "0.1.0"
dependencies = [
    "python-dotenv",
    "httpx",
]

[project.optional-dependencies]
groq = ["groq"]
anthropic = ["anthropic"]
gemini = ["google-genai"]
openai = ["openai"]
all = ["groq", "anthropic", "google-genai", "openai"]

[tool.setuptools.packages.find]
include = ["llm_proxy*"]